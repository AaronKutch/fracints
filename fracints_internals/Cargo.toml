[package]
name = "fracints_internals"
version = "0.2.1"
edition = "2024"
# `flake.nix` and `ci.yml` read this automatically, but run `nix flake update`
# and fix any hashes. The pinned toolchain in `pinned-toolchain.toml` is
# bumped separately.
rust-version = "1.88"
authors = ["Aaron Kutch <aaronkutch@att.net>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AaronKutch/fracints"
documentation = "https://docs.rs/fracints"
description = "Internal utilities for the `fracints` system of crates"

[features]
rand_support = ["rand_core"]

[dependencies]
awint = { workspace = true }
rand_core = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
fracints = { path = "../fracints" }
